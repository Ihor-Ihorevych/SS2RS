[package]
name = "asset-export"
description = "Export textures to PNG and models to glTF 2.0 (single files, contact sheets, whole-install batches with a manifest) for modders and spec reviewers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "asset_export"
path = "src/lib.rs"

[[bin]]
name = "asset-export"
path = "src/main.rs"

[dependencies]
ss2-core = { path = "../../crates/ss2-core" }
ss2-meta = { path = "../../crates/ss2-meta" }
ss2-vfs = { path = "../../crates/ss2-vfs" }
ss2-format-tex = { path = "../../crates/ss2-format-tex" }
ss2-format-bmf = { path = "../../crates/ss2-format-bmf" }
ss2-format-mtr = { path = "../../crates/ss2-format-mtr" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
png.workspace = true
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
ss2-testkit = { path = "../../crates/ss2-testkit" }
flate2.workspace = true
tempfile.workspace = true
# An independent glTF reader: it parses and validates the files this tool writes (tests only).
gltf = { version = "1", default-features = false, features = ["utils"] }
