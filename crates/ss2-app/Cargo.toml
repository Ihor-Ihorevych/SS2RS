[package]
name = "ss2-app"
description = "the SS2RS client / listen-server executable"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ss2-core = { path = "../ss2-core" }
ss2-ui = { path = "../ss2-ui" }
ss2-render = { path = "../ss2-render" }
ss2-render-api = { path = "../ss2-render-api" }
ss2-physics = { path = "../ss2-physics" }
ss2-game = { path = "../ss2-game" }
ss2-world = { path = "../ss2-world" }
ss2-platform = { path = "../ss2-platform" }
ss2-platform-api = { path = "../ss2-platform-api" }
ss2-vfs = { path = "../ss2-vfs" }
png.workspace = true
tracing.workspace = true
# Optional frame profiler (T11-011): `cargo run -p ss2-app --features profile`, see docs/PROFILING.md.
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }

[features]
default = []
# Serve puffin frame/scope data on 127.0.0.1:8585 (`SS2_PROFILE` picks another address).
profile = ["dep:puffin", "dep:puffin_http"]

[dev-dependencies]
ss2-testkit = { path = "../ss2-testkit" }
tempfile.workspace = true

# Embeds the Windows application manifest (DPI awareness, Windows 10 baseline; build.rs, T03-026).
[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"

# Rolls CHANGELOG.md forward on `cargo release replace` (only this crate does it, so it runs once).
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = '## \[Unreleased\]', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
