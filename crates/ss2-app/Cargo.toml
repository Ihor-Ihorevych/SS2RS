[package]
name = "ss2-app"
description = "the SS2RS client / listen-server executable"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ss2-core = { path = "../ss2-core" }
ss2-ui = { path = "../ss2-ui" }
ss2-render = { path = "../ss2-render" }
ss2-platform = { path = "../ss2-platform" }
winit.workspace = true
gilrs.workspace = true
png.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Rolls CHANGELOG.md forward on `cargo release replace` (only this crate does it, so it runs once).
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = '## \[Unreleased\]', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
