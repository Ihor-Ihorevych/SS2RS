[package]
name = "ss2-platform"
description = "window, input, lifecycle and platform paths (track T03)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ss2-core = { path = "../ss2-core" }
ss2-platform-api = { path = "../ss2-platform-api" }
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true
gilrs.workspace = true

# The clipboard (T10-035): `src/clipboard.rs` reads CF_UNICODETEXT.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
