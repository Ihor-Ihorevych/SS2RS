[package]
name = "ss2-spike-ecs"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Throwaway benchmark for RFC 0005 (the ECS choice, T08-001). Not part of the main workspace."

[dependencies]
hecs = "0.11"
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }

# Not a member of the main workspace: a spike must not slow down or constrain the real build, and
# its dependencies are not meant to ship.
[workspace]

[profile.release]
debug = false
opt-level = 3
lto = "thin"
