[package]
name = "ss2-spike-transport"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Throwaway loopback benchmark for RFC 0006 (the network transport, T08-005). Not part of the main workspace."

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

# Not part of the main workspace (see spikes/ecs): a spike must not constrain the real build.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
