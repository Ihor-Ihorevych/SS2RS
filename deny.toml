# cargo-deny policy for SS2RS. Run: cargo deny check
# Changing the license allow-list needs the project owner's approval (docs/roadmap T00-002).

[graph]
all-features = false
no-default-features = false

[advisories]
# Each ignore needs a reason and a revisit condition.
ignore = [
    # `ttf-parser` is unmaintained (not a vulnerability). It is reached only through winit 0.30's
    # Wayland client-side-decoration fallback (winit -> sctk-adwaita -> ab_glyph -> ttf-parser),
    # which parses a bundled UI font. Revisit when winit moves off sctk-adwaita (winit 0.31+).
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser via winit Wayland CSD only; no safe upgrade" },
    # `bincode` 1.3.3 is unmaintained (not a vulnerability; the authors call 1.3.3 complete). It is
    # reached only through puffin, the optional `profile` feature of ss2-app (docs/PROFILING.md),
    # which is off by default and never part of a release build; it encodes frame timings sent to a
    # local viewer. Revisit when puffin drops bincode, or remove the feature's dependency.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode via puffin, optional dev-only profile feature" },
]

[licenses]
# Project license is Apache-2.0; dependencies must be permissive. GPL/AGPL are NOT allowed
# (SS1 is GPL and must never be pulled in, see CLEANROOM.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
