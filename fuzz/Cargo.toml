[package]
name = "ss2-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "cargo-fuzz targets for the parsers and loaders of SS2RS (T12-007; see docs/FUZZING.md)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ss2-core = { path = "../crates/ss2-core" }
ss2-format-skl = { path = "../crates/ss2-format-skl" }
ss2-fuzzkit = { path = "../crates/ss2-fuzzkit" }
ss2-vfs = { path = "../crates/ss2-vfs" }
ss2-game = { path = "../crates/ss2-game" }
ss2-net = { path = "../crates/ss2-net" }
ss2-sim = { path = "../crates/ss2-sim" }
ss2-platform-api = { path = "../crates/ss2-platform-api" }

# Not part of the main workspace: it needs nightly Rust and libFuzzer, and must not slow down
# or break `cargo build --workspace` on stable.
[workspace]

[[bin]]
name = "console_line"
path = "fuzz_targets/console_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "launch_options"
path = "fuzz_targets/launch_options.rs"
test = false
doc = false
bench = false

